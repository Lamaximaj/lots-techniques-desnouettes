<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Accès protégé</title>
<style>
:root{--bg:#f4f3ef;--paper:#fff;--ink:#1d1f1c;--ink-2:#5b5f57;--line:#d9d7cf;--accent:#2f6b4f;--warn:#a3402a}
@media (prefers-color-scheme: dark){:root{--bg:#161815;--paper:#1f221e;--ink:#ecebe5;--ink-2:#a4a89d;--line:#363a33;--accent:#7cc39c;--warn:#e8876f}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:14px}
h1{margin:0;font-size:1.3rem}
p{margin:0;color:var(--ink-2);font-size:.92rem}
input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
label{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink-2)}
button{font:600 1rem/1 system-ui,sans-serif;padding:12px;border:0;border-radius:8px;background:var(--accent);color:var(--paper);cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
#err{color:var(--warn);min-height:1.4em}
</style>
</head>

</form>

  var KEY = "lt-desn-cle";
  function b(s){ var r = atob(s), a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }
