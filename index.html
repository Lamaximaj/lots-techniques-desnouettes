<style>
:root{--bg:#f4f3ef;--paper:#fff;--ink:#1d1f1c;--ink-2:#5b5f57;--line:#d9d7cf;--accent:#2f6b4f;--warn:#a3402a}

button{font:600 1rem/1 system-ui,sans-serif;padding:12px;border:0;border-radius:8px;background:var(--accent);color:var(--paper);cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
#err{color:var(--warn);min-height:1.4em}
</style>

  var KEY = "lt-desn-cle";
  function b(s){ var r = atob(s), a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }
  function s64(buf){ var a = new Uint8Array(buf), s = ""; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  var err = document.getElementById("err"), go = document.getElementById("go");
  if (!window.crypto || !crypto.subtle){ err.textContent = "Ce navigateur ne sait pas déchiffrer la page (il faut une connexion https)."; go.disabled = true; return; }
  function derive(pw){
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey({name: "PBKDF2", salt: b(P.salt), iterations: P.it, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
    });
  }
  function openWith(key){
    return crypto.subtle.decrypt({name: "AES-GCM", iv: b(P.iv)}, key, b(P.ct)).then(function(pt){
      var html = new TextDecoder().decode(pt);
      document.open(); document.write(html); document.close();
    });
  }
  // Clé mémorisée sur cet appareil : ouverture directe.
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved){
    crypto.subtle.importKey("raw", b(saved), {name: "AES-GCM"}, false, ["decrypt"]).then(openWith)
      .catch(function(){ try { localStorage.removeItem(KEY); } catch (e) {} });
  }
  document.getElementById("f").addEventListener("submit", function(ev){
    ev.preventDefault();
    var pw = document.getElementById("pw").value, rem = document.getElementById("rem").checked;
    go.disabled = true; err.textContent = ""; go.textContent = "Déchiffrement…";
    derive(pw).then(function(key){
      return crypto.subtle.decrypt({name: "AES-GCM", iv: b(P.iv)}, key, b(P.ct)).then(function(){
